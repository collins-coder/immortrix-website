<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="description"
      content="Immortrix Technologies Limited is a trusted digital partner providing software development, business systems, automation, system integration, and digital solutions for modern businesses."

      name="keywords"

      href="%PUBLIC_URL%/logo.jpg"
    />

      property="og:title"
      content="Immortrix Technologies Limited | Trusted Digital Partner For Modern Businesses"

      property="og:description"
      content="Digital solutions that help modern businesses work smarter, automate operations, connect systems, and grow."

      property="og:type"
      content="website"

      property="og:url"

      property="og:image"
      content="%PUBLIC_URL%/logo.jpg"

      content="Trusted Digital Partner For Modern Businesses."
